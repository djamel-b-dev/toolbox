<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Orbitron:wght@600;800&family=Press+Start+2P&family=Shippori+Mincho:wght@600;700&family=Space+Grotesk:wght@500;600;700&family=VT323&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
    <title>Toolbox</title>
    <script>
      // Apply the saved theme before first paint so there's no flash of the default one.
      try {
        var t = localStorage.getItem("toolbox:theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
